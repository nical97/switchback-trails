name: Build trail tiles

on:
  schedule:
    - cron: '0 7 2 * *' # the 2nd of every month, 07:00 UTC
  workflow_dispatch: {} # "Run workflow" button for a run anytime

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install osmium
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
      - name: Build tiles from OpenStreetMap
        run: bash scripts/build.sh
      - name: Upload to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          aws s3 sync out/tiles s3://switchback-trails/tiles \
            --endpoint-url "${{ secrets.R2_ENDPOINT }}" \
            --content-encoding gzip --content-type application/json \
            --cache-control "public, max-age=86400" \
            --delete --only-show-errors
          echo "Uploaded $(find out/tiles -name '*.json' | wc -l) files."
